---
name: Dependabot Sync

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - .github/scripts/sync-dependabot.cjs
      - .github/workflows/dependabot-sync.yml
  pull_request:
    paths:
      - .github/scripts/sync-dependabot.cjs
      - .github/scripts/sync-dependabot.test.cjs
      - .github/workflows/dependabot-sync.yml
  schedule:
    # Daily retry window; package updates remain weekly.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: Optional trvny/repo or travnie/repo
        required: false
        type: string
      dry_run:
        description: Preview changes without creating PRs
        required: true
        default: true
        type: boolean

concurrency:
  group: dependabot-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test generator and quota safeguards
        run: node --test .github/scripts/sync-dependabot.test.cjs

  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: ${{ inputs.repository || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Checkout central rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/sync-dependabot.cjs
            .github/scripts/sync-dependabot.test.cjs
          sparse-checkout-cone-mode: false
      - name: Test config generator
        run: node --test .github/scripts/sync-dependabot.test.cjs
      - name: Sync Dependabot through GPTomek
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          github-token: ${{ github.token }}
          retries: 2
          retry-exempt-status-codes: 400,401,403,404,409,422,429
          script: |
            const run = require('./.github/scripts/sync-dependabot.cjs');
            const pat = process.env.GH_PAT ? getOctokit(process.env.GH_PAT) : null;
            await run({ github, pat, core });
