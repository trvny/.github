name: Delete old runs

on:
  workflow_dispatch:
  schedule:
    - cron: "37 21 1/3 * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delete-runs:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Require cross-repository token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Add the repository secret GH_PAT."
            exit 1
          fi

      - name: Delete old workflow runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GH_PAT }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const repositories = [
              'trvny/trvny',
              'trvny/.github',
              'trvny/feeds',
              'trvny/tvpi',
              'trvny/autka',
              'trvny/wambridge',
            ];
            const retainDays = 3;
            const keepMinimumRuns = 3;
            const deleteBatchSize = 5;
            const cutoff = Date.now() - retainDays * 24 * 60 * 60 * 1000;
            const failures = [];
            const summaries = [];

            for (const repository of repositories) {
              const [owner, repo] = repository.split('/');
              let before = null;
              let matched = null;
              let deleted = 0;
              let failed = 0;

              try {
                const [workflows, runs] = await Promise.all([
                  github.paginate(
                    github.rest.actions.listRepoWorkflows,
                    { owner, repo, per_page: 100 },
                  ),
                  github.paginate(
                    github.rest.actions.listWorkflowRunsForRepo,
                    { owner, repo, per_page: 100 },
                  ),
                ]);
                const completedRuns = runs.filter((run) => run.status === 'completed');
                before = completedRuns.length;
                const activeWorkflowIds = new Set(workflows.map((workflow) => workflow.id));
                const runsByWorkflow = new Map();

                for (const run of completedRuns) {
                  const workflowRuns = runsByWorkflow.get(run.workflow_id) ?? [];
                  workflowRuns.push(run);
                  runsByWorkflow.set(run.workflow_id, workflowRuns);
                }

                const runsToDelete = [];
                for (const [workflowId, workflowRuns] of runsByWorkflow) {
                  workflowRuns.sort(
                    (left, right) => Date.parse(right.created_at) - Date.parse(left.created_at),
                  );
                  const minimum = activeWorkflowIds.has(workflowId) ? keepMinimumRuns : 0;

                  for (const run of workflowRuns.slice(minimum)) {
                    if (Date.parse(run.created_at) < cutoff) {
                      runsToDelete.push(run);
                    }
                  }
                }

                matched = runsToDelete.length;
                core.info(`${repository}: ${matched} run(s) to delete from ${before}`);
                for (let offset = 0; offset < runsToDelete.length; offset += deleteBatchSize) {
                  const batch = runsToDelete.slice(offset, offset + deleteBatchSize);
                  const results = await Promise.allSettled(
                    batch.map((run) =>
                      github.rest.actions.deleteWorkflowRun({
                        owner,
                        repo,
                        run_id: run.id,
                      }),
                    ),
                  );

                  for (let index = 0; index < results.length; index += 1) {
                    const result = results[index];
                    const run = batch[index];
                    if (result.status === 'fulfilled') {
                      deleted += 1;
                    } else {
                      failed += 1;
                      failures.push(
                        `${repository}#${run.id}: ${result.reason?.message ?? result.reason}`,
                      );
                      core.error(failures.at(-1));
                    }
                  }
                }
              } catch (error) {
                failed += 1;
                failures.push(`${repository}: ${error.message}`);
                core.error(failures.at(-1));
              }

              summaries.push([
                repository,
                before === null ? 'N/A' : String(before),
                matched === null ? 'N/A' : String(matched),
                String(deleted),
                String(failed),
                before === null ? 'N/A' : String(Math.max(0, before - deleted)),
              ]);
            }

            await core.summary
              .addHeading('Workflow run cleanup')
              .addRaw(`Retention: ${retainDays} days; minimum kept per active workflow: ${keepMinimumRuns}.`)
              .addTable([
                [
                  { data: 'Repository', header: true },
                  { data: 'Completed before', header: true },
                  { data: 'Matched', header: true },
                  { data: 'Deleted', header: true },
                  { data: 'Failed', header: true },
                  { data: 'Completed remaining', header: true },
                ],
                ...summaries,
              ])
              .write();

            if (failures.length > 0) {
              core.setFailed(`${failures.length} workflow run(s) could not be deleted`);
            }

  delete-caches:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Require cross-repository token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Add the repository secret GH_PAT."
            exit 1
          fi

      - name: Delete stale Actions caches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GH_PAT }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const repositories = [
              'trvny/trvny',
              'trvny/.github',
              'trvny/feeds',
              'trvny/tvpi',
              'trvny/autka',
              'trvny/wambridge',
              'trvny/.ai',
              'trvny/WiFi-Automatic',
            ];
            const retainDays = 7;
            const keepMinimumCaches = 3;
            const budgetMinimumAgeHours = 24;
            const budgetTargetRatio = 0.95;
            const deleteBatchSize = 5;
            const cutoff = Date.now() - retainDays * 24 * 60 * 60 * 1000;
            const budgetCutoff = Date.now() - budgetMinimumAgeHours * 60 * 60 * 1000;
            const failures = [];
            const summaries = [];

            const formatBytes = (bytes) => {
              if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
              const units = ['B', 'KiB', 'MiB', 'GiB'];
              const exponent = Math.min(
                Math.floor(Math.log(bytes) / Math.log(1024)),
                units.length - 1,
              );
              return `${(bytes / 1024 ** exponent).toFixed(exponent === 0 ? 0 : 1)} ${units[exponent]}`;
            };

            for (const repository of repositories) {
              const [owner, repo] = repository.split('/');
              let before = null;
              let beforeBytes = null;
              let storageLimitBytes = null;
              let staleMatched = 0;
              let budgetMatched = 0;
              let deleted = 0;
              let deletedBytes = 0;
              let failed = 0;

              try {
                const caches = [];
                for (let page = 1; ; page += 1) {
                  const response = await github.request(
                    'GET /repos/{owner}/{repo}/actions/caches',
                    { owner, repo, per_page: 100, page },
                  );
                  const pageCaches = response.data.actions_caches ?? [];
                  caches.push(...pageCaches);
                  if (pageCaches.length < 100) break;
                }

                caches.sort(
                  (left, right) =>
                    Date.parse(right.last_accessed_at ?? right.created_at) -
                    Date.parse(left.last_accessed_at ?? left.created_at),
                );
                before = caches.length;
                beforeBytes = caches.reduce(
                  (total, cache) => total + (cache.size_in_bytes ?? 0),
                  0,
                );

                try {
                  const response = await github.request(
                    'GET /repos/{owner}/{repo}/actions/cache/storage-limit',
                    { owner, repo },
                  );
                  const limitGb = Number(response.data.max_cache_size_gb);
                  if (Number.isFinite(limitGb) && limitGb > 0) {
                    storageLimitBytes = limitGb * 1024 ** 3;
                  }
                } catch (error) {
                  core.warning(
                    `${repository}: cache storage limit unavailable (${error.message}); budget pruning disabled.`,
                  );
                }

                const protectedIds = new Set(
                  caches.slice(0, keepMinimumCaches).map((cache) => cache.id),
                );
                const selected = new Map();
                for (const cache of caches.slice(keepMinimumCaches)) {
                  if (Date.parse(cache.last_accessed_at ?? cache.created_at) < cutoff) {
                    selected.set(cache.id, cache);
                    staleMatched += 1;
                  }
                }

                let projectedBytes = beforeBytes - [...selected.values()].reduce(
                  (total, cache) => total + (cache.size_in_bytes ?? 0),
                  0,
                );

                if (storageLimitBytes !== null && projectedBytes > storageLimitBytes) {
                  const targetBytes = Math.floor(storageLimitBytes * budgetTargetRatio);
                  for (const cache of [...caches].reverse()) {
                    if (projectedBytes <= targetBytes) break;
                    if (protectedIds.has(cache.id) || selected.has(cache.id)) continue;
                    if (Date.parse(cache.last_accessed_at ?? cache.created_at) >= budgetCutoff) {
                      continue;
                    }
                    selected.set(cache.id, cache);
                    projectedBytes -= cache.size_in_bytes ?? 0;
                    budgetMatched += 1;
                  }
                }

                const cachesToDelete = [...selected.values()];
                core.info(
                  `${repository}: ${staleMatched} stale + ${budgetMatched} budget cache(s) from ${before}`,
                );

                for (let offset = 0; offset < cachesToDelete.length; offset += deleteBatchSize) {
                  const batch = cachesToDelete.slice(offset, offset + deleteBatchSize);
                  const results = await Promise.allSettled(
                    batch.map((cache) =>
                      github.request(
                        'DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}',
                        { owner, repo, cache_id: cache.id },
                      ),
                    ),
                  );

                  for (let index = 0; index < results.length; index += 1) {
                    const result = results[index];
                    const cache = batch[index];
                    if (result.status === 'fulfilled') {
                      deleted += 1;
                      deletedBytes += cache.size_in_bytes ?? 0;
                    } else {
                      failed += 1;
                      failures.push(
                        `${repository} cache #${cache.id}: ${result.reason?.message ?? result.reason}`,
                      );
                      core.error(failures.at(-1));
                    }
                  }
                }
              } catch (error) {
                failed += 1;
                failures.push(`${repository}: ${error.message}`);
                core.error(failures.at(-1));
              }

              summaries.push([
                repository,
                before === null ? 'N/A' : String(before),
                beforeBytes === null ? 'N/A' : formatBytes(beforeBytes),
                storageLimitBytes === null ? 'N/A' : formatBytes(storageLimitBytes),
                String(staleMatched),
                String(budgetMatched),
                String(deleted),
                formatBytes(deletedBytes),
                beforeBytes === null ? 'N/A' : formatBytes(Math.max(0, beforeBytes - deletedBytes)),
                String(failed),
              ]);
            }

            await core.summary
              .addHeading('Actions cache cleanup')
              .addRaw(
                `Stale after ${retainDays} days without access. If usage exceeds the repository cache limit, least-recently-used caches older than ${budgetMinimumAgeHours}h are pruned toward ${Math.round(budgetTargetRatio * 100)}% of that limit. At least ${keepMinimumCaches} newest caches are always kept.`,
              )
              .addTable([
                [
                  { data: 'Repository', header: true },
                  { data: 'Before', header: true },
                  { data: 'Size', header: true },
                  { data: 'Limit', header: true },
                  { data: 'Stale', header: true },
                  { data: 'Budget', header: true },
                  { data: 'Deleted', header: true },
                  { data: 'Freed', header: true },
                  { data: 'After', header: true },
                  { data: 'Failed', header: true },
                ],
                ...summaries,
              ])
              .write();

            if (failures.length > 0) {
              core.setFailed(`${failures.length} Actions cache operation(s) failed`);
            }
