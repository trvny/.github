---
name: upkeep

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: upkeep-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  upkeep:
    name: Update PR branches
    runs-on: ubuntu-slim
    timeout-minutes: 90
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout trusted workflow script
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/pr-upkeep.cjs
          sparse-checkout-cone-mode: false

      - name: Require event-producing token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Add the repository secret GH_PAT."
            exit 1
          fi

      - name: Process open PRs
        uses: actions/github-script@v9
        env:
          AUTOMERGE_ALLOW_NO_CHECKS: >-
            ${{ vars.PR_AUTOMERGE_ALLOW_NO_CHECKS || 'false' }}
          AUTOMERGE_ENABLED: "false"
          AUTOMERGE_IDLE_HOURS: ${{ vars.PR_AUTOMERGE_IDLE_HOURS || '4' }}
          AUTOMERGE_LABEL: ${{ vars.PR_AUTOMERGE_LABEL || 'automerge' }}
          AUTOMERGE_METHOD: ${{ vars.PR_AUTOMERGE_METHOD || 'squash' }}
          PR_UPKEEP_TARGET_REPOS: >-
            trvny/trvny,
            trvny/.github,
            trvny/feeds,
            trvny/tvpi,
            trvny/autka
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const run = require('./.github/scripts/pr-upkeep.cjs');
            const failures = [];
            const repositories = process.env.PR_UPKEEP_TARGET_REPOS
              .split(/[\n,]+/)
              .map((item) => item.trim())
              .filter(Boolean);

            for (const repository of [...new Set(repositories)]) {
              const [owner, repo] = repository.split('/');
              core.startGroup(`Update ${repository}`);
              try {
                const result = await run({
                  github,
                  context: { repo: { owner, repo } },
                  core,
                });
                failures.push(
                  ...(result.failures ?? []).map(
                    (failure) => `${repository}: ${failure}`,
                  ),
                );
              } catch (error) {
                failures.push(`${repository}: ${error.message}`);
                core.error(failures.at(-1));
              } finally {
                core.endGroup();
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('\n'));
            }

  readmes:
    name: Refresh shared READMEs
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/update-readme-quote.cjs
            .github/scripts/update-shared-readmes.cjs
          sparse-checkout-cone-mode: false

      - name: Require cross-repository token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Add the repository secret GH_PAT."
            exit 1
          fi

      - name: Update READMEs
        uses: actions/github-script@v9
        env:
          GIST_ID: 167d2271e3cf7d21e118aa7d906a7d2c
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          README_FEED_URLS: >-
            ${{ vars.README_FEED_URLS || 'https://raw.githubusercontent.com/trvny/feeds/main/feedseek/feeds/feed_daily_digest.xml' }},
            https://news.google.com/atom/topics/CAAqHAgKIhZDQklTQ2pvSWJHOWpZV3hmZGpJb0FBUAE/sections/CAQiUENCSVNOam9JYkc5allXeGZkakpDRUd4dlkyRnNYM1l5WDNObFkzUnBiMjV5Q3hJSkwyMHZNREl5WW5OdWVnc0tDUzl0THpBeU1tSnpiaWdBKjEIACotCAoiJ0NCSVNGem9JYkc5allXeGZkako2Q3dvSkwyMHZNREl5WW5OdUtBQVABUAE?hl=pl&gl=PL&ceid=PL%3Apl&oc=11,
            https://raw.githubusercontent.com/trvny/feeds/main/feedseek/feeds/feed_aibridge.xml,
            https://raw.githubusercontent.com/trvny/feeds/main/feedseek/feeds/feed_github.xml,
            https://antyweb.pl/feed/,
            https://trvny.github.io/feeds/feed_geopolitics.xml,
            https://trvny.github.io/feeds/feed_reuters.xml,
            https://weather.travny.workers.dev/feed.atom
          README_FEED_MAX_ENTRIES: ${{ vars.README_FEED_MAX_ENTRIES || '6' }}
          README_PATH: README.md
          README_TARGET_REPOS: >-
            ${{ vars.README_TARGET_REPOS || 'trvny/feeds:both,trvny/tvpi:both,trvny/autka:both,trvny/wambridge:both,trvny/.github:both,trvny/trvny:both' }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const run = require('./.github/scripts/update-shared-readmes.cjs');
            await run({
              github,
              context: { repo: { owner: 'trvny', repo: 'trvny' } },
              core,
            });
