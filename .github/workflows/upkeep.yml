---
name: upkeep

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "37 21 */2 * *"
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task
        required: true
        default: all
        type: choice
        options:
          - all
          - prs
          - readmes
          - cleanup
          - eol

concurrency:
  group: upkeep-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

env:
  OWNERS: |
    trvny
    travnie

jobs:
  discover-repositories:
    name: Discover repositories
    if: >-
      github.event_name == 'schedule' ||
      inputs.task != 'readmes'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      repositories: ${{ steps.discover.outputs.repositories }}
      public_repositories: ${{ steps.discover.outputs.public_repositories }}
      run_eol: ${{ steps.discover.outputs.run_eol }}
    steps:
      - name: Checkout workflow script
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/discover-repositories.cjs
          sparse-checkout-cone-mode: false

      - name: Require cross-repository token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Add the repository secret GH_PAT."
            exit 1
          fi

      - name: Discover repositories
        id: discover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MAINTENANCE_TASK: ${{ inputs.task || 'all' }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const run = require('./.github/scripts/discover-repositories.cjs');
            await run({ github, context, core });
  upkeep:
    name: Update PR branches
    needs: discover-repositories
    if: >-
      github.event_name == 'schedule' ||
      inputs.task == 'all' ||
      inputs.task == 'prs'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    env:
      REPOSITORIES_JSON: ${{ needs.discover-repositories.outputs.repositories }}
    steps:
      - name: Checkout trusted workflow scripts
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/open-prs.cjs
            .github/scripts/pr-upkeep.cjs
          sparse-checkout-cone-mode: false

      - name: Require event-producing token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Add the repository secret GH_PAT."
            exit 1
          fi

      - name: Process open PRs
        uses: actions/github-script@v9
        env:
          AUTOMERGE_ALLOW_NO_CHECKS: >-
            ${{ vars.PR_AUTOMERGE_ALLOW_NO_CHECKS || 'false' }}
          AUTOMERGE_ENABLED: "false"
          AUTOMERGE_IDLE_HOURS: ${{ vars.PR_AUTOMERGE_IDLE_HOURS || '4' }}
          AUTOMERGE_LABEL: ${{ vars.PR_AUTOMERGE_LABEL || 'automerge' }}
          AUTOMERGE_METHOD: ${{ vars.PR_AUTOMERGE_METHOD || 'squash' }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const run = require('./.github/scripts/pr-upkeep.cjs');
            const failures = [];
            const repositories = JSON.parse(process.env.REPOSITORIES_JSON || '[]');
            if (repositories.length === 0) {
              core.setFailed('Repository discovery returned an empty list.');
              return;
            }
            for (const repository of repositories) {
              const [owner, repo] = repository.split('/');
              core.startGroup(`Update ${repository}`);
              try {
                const result = await run({
                  github,
                  context: { repo: { owner, repo } },
                  core,
                });
                failures.push(
                  ...(result.failures ?? []).map(
                    (failure) => `${repository}: ${failure}`,
                  ),
                );
              } catch (error) {
                failures.push(`${repository}: ${error.message}`);
                core.error(failures.at(-1));
              } finally {
                core.endGroup();
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('\n'));
            }

      - name: Summarize open PRs
        if: ${{ always() }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const {
              listOpenPrs,
              renderOpenPrTable,
            } = require('./.github/scripts/open-prs.cjs');
            const owners = process.env.OWNERS.trim().split(/\s+/);
            const prs = [];
            for (const owner of owners) {
              prs.push(...await listOpenPrs({
                github,
                owner,
                qualifier: owner === context.repo.owner ? 'user' : 'org',
              }));
            }
            prs.sort(
              (left, right) =>
                left.repository.localeCompare(right.repository) ||
                left.number - right.number,
            );
            await core.summary
              .addRaw(
                `## Open pull requests (${prs.length})\n\n${renderOpenPrTable(prs)}`,
              )
              .write();

  readmes:
    name: Refresh shared READMEs
    if: >-
      github.event_name == 'schedule' ||
      inputs.task == 'all' ||
      inputs.task == 'readmes'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/open-prs.cjs
            .github/scripts/update-readme-quote.cjs
            .github/scripts/update-shared-readmes.cjs
          sparse-checkout-cone-mode: false

      - name: Require cross-repository token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Add the repository secret GH_PAT."
            exit 1
          fi

      - name: Update READMEs
        uses: actions/github-script@v9
        env:
          GIST_ID: 167d2271e3cf7d21e118aa7d906a7d2c
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          README_FEED_URLS: >-
            ${{ vars.README_FEED_URLS || 'https://raw.githubusercontent.com/trvny/feedseek/main/feeds/feed_daily_digest.xml' }},
            https://news.google.com/atom/topics/CAAqHAgKIhZDQklTQ2pvSWJHOWpZV3hmZGpJb0FBUAE/sections/CAQiUENCSVNOam9JYkc5allXeGZkakpDRUd4dlkyRnNYM1l5WDNObFkzUnBiMjV5Q3hJSkwyMHZNREl5WW5OdWVnc0tDUzl0THpBeU1tSnpiaWdBKjEIACotCAoiJ0NCSVNGem9JYkc5allXeGZkako2Q3dvSkwyMHZNREl5WW5OdUtBQVABUAE?hl=pl&gl=PL&ceid=PL%3Apl&oc=11,
            https://raw.githubusercontent.com/trvny/feedseek/main/feeds/feed_aibridge.xml,
            https://raw.githubusercontent.com/trvny/feedseek/main/feeds/feed_github.xml,
            https://antyweb.pl/feed/,
            https://trvny.github.io/feedseek/feed_geopolitics.xml,
            https://trvny.github.io/feedseek/feed_reuters.xml
          README_FEED_MAX_ENTRIES: ${{ vars.README_FEED_MAX_ENTRIES || '6' }}
          README_PATH: README.md
          README_PROFILE_TARGET_REPOS: >-
            ${{ vars.README_PROFILE_TARGET_REPOS || 'travnie/.github:both' }}
          README_TARGET_REPOS: >-
            ${{ vars.README_TARGET_REPOS || 'trvny/feedseek:both,travnie/kanarek:both,trvny/tvpi:both,travnie/Autka:both,travnie/wambridge:both,trvny/.github:both,trvny/trvny:both,travnie/aistee:both,travnie/twojstar:both,trvny/.ai:both' }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const run = require('./.github/scripts/update-shared-readmes.cjs');
            await run({
              github,
              context: { repo: { owner: 'trvny', repo: 'trvny' } },
              core,
            });

  delete-runs:
    needs: discover-repositories
    if: >-
      github.event_name == 'schedule' ||
      inputs.task == 'all' ||
      inputs.task == 'cleanup'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REPOSITORIES_JSON: ${{ needs.discover-repositories.outputs.repositories }}
    steps:
      - name: Checkout workflow script
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/delete-workflow-runs.cjs
          sparse-checkout-cone-mode: false

      - name: Delete old workflow runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GH_PAT }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const run = require('./.github/scripts/delete-workflow-runs.cjs');
            await run({ github, core });
  delete-caches:
    needs: discover-repositories
    if: >-
      github.event_name == 'schedule' ||
      inputs.task == 'all' ||
      inputs.task == 'cleanup'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REPOSITORIES_JSON: ${{ needs.discover-repositories.outputs.repositories }}
    steps:
      - name: Checkout workflow script
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/delete-actions-caches.cjs
          sparse-checkout-cone-mode: false

      - name: Delete stale Actions caches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GH_PAT }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const run = require('./.github/scripts/delete-actions-caches.cjs');
            await run({ github, core });
  eol-guard:
    name: Stored blobs match .gitattributes
    needs: discover-repositories
    if: needs.discover-repositories.outputs.run_eol == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REPOSITORIES: ${{ needs.discover-repositories.outputs.public_repositories }}
    steps:
      - name: Checkout workflow script
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/eol-guard.sh
          sparse-checkout-cone-mode: false

      - name: Check every repository
        shell: bash
        run: |
          bash --noprofile --norc -e -o pipefail .github/scripts/eol-guard.sh
