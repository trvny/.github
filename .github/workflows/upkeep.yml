---
name: upkeep

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "37 21 */2 * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: upkeep-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  upkeep:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 21 */2 * *'
    name: Update PR branches
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout trusted workflow script
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/pr-upkeep.cjs
          sparse-checkout-cone-mode: false

      - name: Require event-producing token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Add the repository secret GH_PAT."
            exit 1
          fi

      - name: Process open PRs
        uses: actions/github-script@v9
        env:
          AUTOMERGE_ALLOW_NO_CHECKS: >-
            ${{ vars.PR_AUTOMERGE_ALLOW_NO_CHECKS || 'false' }}
          AUTOMERGE_ENABLED: "false"
          AUTOMERGE_IDLE_HOURS: ${{ vars.PR_AUTOMERGE_IDLE_HOURS || '4' }}
          AUTOMERGE_LABEL: ${{ vars.PR_AUTOMERGE_LABEL || 'automerge' }}
          AUTOMERGE_METHOD: ${{ vars.PR_AUTOMERGE_METHOD || 'squash' }}
          PR_UPKEEP_TARGET_REPOS: >-
            trvny/trvny,
            trvny/.github,
            trvny/feedseek,
            trvny/kanarek,
            trvny/tvpi,
            trvny/autka,
            trvny/wambridge
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const run = require('./.github/scripts/pr-upkeep.cjs');
            const failures = [];
            const repositories = process.env.PR_UPKEEP_TARGET_REPOS
              .split(/[\n,]+/)
              .map((item) => item.trim())
              .filter(Boolean);

            for (const repository of [...new Set(repositories)]) {
              const [owner, repo] = repository.split('/');
              core.startGroup(`Update ${repository}`);
              try {
                const result = await run({
                  github,
                  context: { repo: { owner, repo } },
                  core,
                });
                failures.push(
                  ...(result.failures ?? []).map(
                    (failure) => `${repository}: ${failure}`,
                  ),
                );
              } catch (error) {
                failures.push(`${repository}: ${error.message}`);
                core.error(failures.at(-1));
              } finally {
                core.endGroup();
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('\n'));
            }

  readmes:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 21 */2 * *'
    name: Refresh shared READMEs
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/update-readme-quote.cjs
            .github/scripts/update-shared-readmes.cjs
          sparse-checkout-cone-mode: false

      - name: Require cross-repository token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Add the repository secret GH_PAT."
            exit 1
          fi

      - name: Update READMEs
        uses: actions/github-script@v9
        env:
          GIST_ID: 167d2271e3cf7d21e118aa7d906a7d2c
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          README_FEED_URLS: >-
            ${{ vars.README_FEED_URLS || 'https://raw.githubusercontent.com/trvny/feedseek/main/feeds/feed_daily_digest.xml' }},
            https://news.google.com/atom/topics/CAAqHAgKIhZDQklTQ2pvSWJHOWpZV3hmZGpJb0FBUAE/sections/CAQiUENCSVNOam9JYkc5allXeGZkakpDRUd4dlkyRnNYM1l5WDNObFkzUnBiMjV5Q3hJSkwyMHZNREl5WW5OdWVnc0tDUzl0THpBeU1tSnpiaWdBKjEIACotCAoiJ0NCSVNGem9JYkc5allXeGZkako2Q3dvSkwyMHZNREl5WW5OdUtBQVABUAE?hl=pl&gl=PL&ceid=PL%3Apl&oc=11,
            https://raw.githubusercontent.com/trvny/feedseek/main/feeds/feed_aibridge.xml,
            https://raw.githubusercontent.com/trvny/feedseek/main/feeds/feed_github.xml,
            https://antyweb.pl/feed/,
            https://trvny.github.io/feedseek/feed_geopolitics.xml,
            https://trvny.github.io/feedseek/feed_reuters.xml,
            https://weather.travny.workers.dev/feed.atom
          README_FEED_MAX_ENTRIES: ${{ vars.README_FEED_MAX_ENTRIES || '6' }}
          README_PATH: README.md
          README_TARGET_REPOS: >-
            ${{ vars.README_TARGET_REPOS || 'trvny/feedseek:both,trvny/kanarek:both,trvny/tvpi:both,trvny/autka:both,trvny/wambridge:both,trvny/.github:both,trvny/trvny:both' }},
            trvny/.ai:both
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const run = require('./.github/scripts/update-shared-readmes.cjs');
            await run({
              github,
              context: { repo: { owner: 'trvny', repo: 'trvny' } },
              core,
            });

  fix-pr297:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    name: Validate and patch trvny #297
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout trusted fixer
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/tmp-pr297-batch-fixer.py
          sparse-checkout-cone-mode: false
          path: helper

      - name: Checkout PR branch
        uses: actions/checkout@v7.0.1
        with:
          repository: trvny/trvny
          ref: feat/code-change-autopilot
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          fetch-depth: 0
          path: target

      - name: Apply review fixes
        working-directory: target
        run: python ../helper/.github/scripts/tmp-pr297-batch-fixer.py

      - name: Validate companion
        working-directory: target/gh-apps/kanarek-companion
        run: |
          npm ci
          npm run check

      - name: Commit validated fixes
        working-directory: target
        run: |
          git config user.name GPTomek
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git add \
            gh-apps/kanarek-companion/src/code-change-orchestration.ts \
            gh-apps/kanarek-companion/src/gpt-actions.ts \
            gh-apps/kanarek-companion/test/code-change-orchestration.test.ts \
            gh-apps/kanarek-companion/test/gpt-actions.test.ts
          git diff --cached --quiet || git commit -m 'fix(gpt-actions): harden recovery and verification'

      - name: Push validated fixes
        working-directory: target
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/trvny/trvny.git"
          git push origin HEAD:feat/code-change-autopilot
