name: Temporary PR 297 Devin PR trigger

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fix:
    if: github.head_ref == 'tmp/pr297-devin-run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7.0.1
        with:
          repository: trvny/trvny
          ref: feat/code-change-autopilot
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Apply retry recovery fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('gh-apps/kanarek-companion/src/code-change-orchestration.ts')
          text = path.read_text()
          old = """      let editProgress = progress;
      if (progress.stage === 'waiting_ci_review') {
        if (!progress.pullRequest) throw new CodeChangeError('missing_pull_request_progress', 500);
        const current = await branchHead(request, invoke, core);
        if (current !== progress.branchHead) {
          if (!await verifyRecoveredCommit(request, invoke, core, progress.branchHead, current, submitted)) {
            throw new CodeChangeError('branch_head_changed', 409, { expected: progress.branchHead, current });
          }
          editProgress = {
            ...progress,
            branchHead: current,
            pullRequest: { ...progress.pullRequest, headSha: current },
          };
        }
        await assertPullRequestEditable(request, invoke, core, editProgress);
      }

      const previousHead = editProgress.branchHead;
      const newHead = await commitEdit(request, invoke, core, editProgress, submitted);
"""
          new = """      let editProgress = progress;
      let recoveredEdit = false;
      if (progress.stage === 'waiting_ci_review') {
        if (!progress.pullRequest) throw new CodeChangeError('missing_pull_request_progress', 500);
        const current = await branchHead(request, invoke, core);
        if (current !== progress.branchHead) {
          if (!await verifyRecoveredCommit(request, invoke, core, progress.branchHead, current, submitted)) {
            throw new CodeChangeError('branch_head_changed', 409, { expected: progress.branchHead, current });
          }
          editProgress = {
            ...progress,
            branchHead: current,
            pullRequest: { ...progress.pullRequest, headSha: current },
          };
          recoveredEdit = true;
        }
        await assertPullRequestEditable(request, invoke, core, editProgress);
      }

      const previousHead = editProgress.branchHead;
      const newHead = recoveredEdit
        ? editProgress.branchHead
        : await commitEdit(request, invoke, core, editProgress, submitted);
"""
          if old not in text:
              if 'let recoveredEdit = false;' in text:
                  raise SystemExit(0)
              raise SystemExit('retry block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate companion
        working-directory: gh-apps/kanarek-companion
        run: |
          npm ci
          npm run check

      - name: Commit and push validated fix
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name GPTomek
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git add gh-apps/kanarek-companion/src/code-change-orchestration.ts
          git diff --cached --quiet || git commit -m 'fix(gpt-actions): avoid duplicate recovered edit commit'
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/trvny/trvny.git"
          git push origin HEAD:feat/code-change-autopilot
