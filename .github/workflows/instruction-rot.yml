---
name: Instruction Rot

on: # yamllint disable-line rule:truthy
  workflow_call:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - CODEX.md
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/GEMINI.md"
      - "**/CODEX.md"
      - "**/copilot-instructions.md"
      - ".github/instructions/**"
      - "**/.cursor/rules/**"
      - "**/.cursorrules"
      - "**/.windsurfrules"
      - "**/.clinerules"
      - ".github/instruction-checks/**"
      - ".github/workflows/instruction-rot.yml"
  push:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - CODEX.md
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/GEMINI.md"
      - "**/CODEX.md"
      - "**/copilot-instructions.md"
      - ".github/instructions/**"
      - "**/.cursor/rules/**"
      - "**/.cursorrules"
      - "**/.windsurfrules"
      - "**/.clinerules"
      - ".github/instruction-checks/**"
      - ".github/workflows/instruction-rot.yml"
  workflow_dispatch:

concurrency:
  group: instruction-rot-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HARNESS_REF: ${{ github.repository == 'trvny/.github' && github.sha || 'main' }}

jobs:
  rotcheck:
    name: rotcheck
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Instruction Rot harness
        uses: actions/checkout@v7
        with:
          repository: trvny/.github
          ref: ${{ env.HARNESS_REF }}
          path: .instruction-rot
          persist-credentials: false
      - name: Run Brainrot structural check
        run: bash .instruction-rot/.github/instruction-checks/run-brainrot.sh rotcheck "$GITHUB_WORKSPACE"

  yaplint:
    name: yaplint
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Instruction Rot harness
        uses: actions/checkout@v7
        with:
          repository: trvny/.github
          ref: ${{ env.HARNESS_REF }}
          path: .instruction-rot
          persist-credentials: false
      - name: Run Brainrot yap budget
        run: bash .instruction-rot/.github/instruction-checks/run-brainrot.sh yaplint "$GITHUB_WORKSPACE"

  rickcheck:
    name: Never Gonna Deploy You
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Instruction Rot harness
        uses: actions/checkout@v7
        with:
          repository: trvny/.github
          ref: ${{ env.HARNESS_REF }}
          path: .instruction-rot
          persist-credentials: false
      - id: rickcheck
        name: Run RickLang reference guard
        continue-on-error: true
        run: bash .instruction-rot/.github/instruction-checks/run-ricklang.sh "$GITHUB_WORKSPACE"
      - name: Render RickLang failure WAV
        if: steps.rickcheck.outcome == 'failure'
        run: >-
          bash .instruction-rot/.github/instruction-checks/make-ricklang-wav.sh
          "${{ runner.temp }}/never-gonna-deploy-you.wav"
      - name: Upload RickLang failure WAV
        if: steps.rickcheck.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: never-gonna-deploy-you-${{ github.event.repository.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/never-gonna-deploy-you.wav
          if-no-files-found: warn
          retention-days: 7
      - name: Propagate RickLang failure
        if: steps.rickcheck.outcome == 'failure'
        run: exit 1

  report:
    name: PR report
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [rotcheck, yaplint, rickcheck]
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment Instruction Rot result
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          ROTCHECK: ${{ needs.rotcheck.result }}
          YAPLINT: ${{ needs.yaplint.result }}
          RICKCHECK: ${{ needs.rickcheck.result }}
        with:
          script: |
            const marker = '<!-- instruction-rot-report -->';
            const icon = (result) =>
              result === 'success' ? '✅' : result === 'skipped' ? '⏭️' : '❌';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactName =
              `never-gonna-deploy-you-${context.payload.repository.name}-${context.runId}`;
            const audioLine = process.env.RICKCHECK === 'success'
              ? '🎧 RickLang WAV: generated only when the RickLang guard fails.'
              : `🎧 RickLang WAV: artifact **${artifactName}** in [this run](${runUrl}).`;
            const body = [
              marker,
              '### Instruction Rot 🧠',
              '',
              '| check | result |',
              '| --- | --- |',
              `| rotcheck | ${icon(process.env.ROTCHECK)} ${process.env.ROTCHECK} |`,
              `| yaplint | ${icon(process.env.YAPLINT)} ${process.env.YAPLINT} |`,
              `| Never Gonna Deploy You | ${icon(process.env.RICKCHECK)} ${process.env.RICKCHECK} |`,
              '',
              audioLine,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
