---
name: Instruction Rot

on: # yamllint disable-line rule:truthy
  workflow_call:
  pull_request:
    paths: &instruction-paths
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/GEMINI.md"
      - "**/CODEX.md"
      - "**/copilot-instructions.md"
      - ".github/instructions/**"
      - "**/.cursor/rules/**"
      - "**/.cursorrules"
      - "**/.windsurfrules"
      - "**/.clinerules"
      - ".github/instruction-checks/**"
      - ".github/actions/instruction-rot/**"
      - ".github/workflows/instruction-rot.yml"
  push:
    branches: [main]
    paths: *instruction-paths
  workflow_dispatch:

concurrency:
  group: instruction-rot-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HARNESS_REF: ${{ github.repository == 'trvny/.github' && github.sha || 'main' }}

jobs:
  checks:
    name: instruction-checks
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.rot.outputs.changed }}
      rotcheck: ${{ steps.rot.outputs.rotcheck }}
      yaplint: ${{ steps.rot.outputs.yaplint }}
      rickcheck: ${{ steps.rot.outputs.rickcheck }}
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Instruction Rot harness
        uses: actions/checkout@v7
        with:
          repository: trvny/.github
          ref: ${{ env.HARNESS_REF }}
          path: .instruction-rot
          persist-credentials: false
      - name: Run Instruction Rot
        id: rot
        uses: ./.instruction-rot/.github/actions/instruction-rot
        with:
          base-sha: ${{ env.BASE_SHA }}
          head-sha: ${{ env.HEAD_SHA }}

  report:
    name: PR report
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.checks.outputs.changed == 'true'
    needs: [checks]
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment Instruction Rot result
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          ROTCHECK: ${{ needs.checks.outputs.rotcheck }}
          YAPLINT: ${{ needs.checks.outputs.yaplint }}
          RICKCHECK: ${{ needs.checks.outputs.rickcheck }}
        with:
          script: |
            const marker = '<!-- instruction-rot-report -->';
            const icon = (result) =>
              result === 'success' ? '✅' : result === 'skipped' ? '⏭️' : '❌';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactName =
              `never-gonna-deploy-you-${context.payload.repository.name}-${context.runId}`;
            const audioLine = process.env.RICKCHECK === 'failure'
              ? `🎧 RickLang WAV: artifact **${artifactName}** in [this run](${runUrl}).`
              : '🎧 RickLang WAV: generated only when the RickLang guard fails.';
            const body = [
              marker,
              '### Instruction Rot 🧠',
              '',
              '| check | result |',
              '| --- | --- |',
              `| rotcheck | ${icon(process.env.ROTCHECK)} ${process.env.ROTCHECK} |`,
              `| yaplint | ${icon(process.env.YAPLINT)} ${process.env.YAPLINT} |`,
              `| Never Gonna Deploy You | ${icon(process.env.RICKCHECK)} ${process.env.RICKCHECK} |`,
              '',
              audioLine,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
