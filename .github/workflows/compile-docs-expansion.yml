name: Compile docs expansion locks

on:
  pull_request:
    paths:
      - .github/workflows/compile-docs-expansion.yml

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/gh-aw/actions/setup-cli@v0.87.0
        with:
          version: v0.87.0
      - name: Fetch docs workflow sources
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          curl -fsSL \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/trvny/trvny/contents/.github/workflows/docs-worker.md?ref=ci%2Fexpand-docs-control" \
            -o .github/workflows/docs-worker.md
          curl -fsSL \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/trvny/trvny/contents/.github/workflows/docs-orchestrator.md?ref=ci%2Fexpand-docs-control" \
            -o .github/workflows/docs-orchestrator.md
      - name: Compile worker first
        run: |
          set -euo pipefail
          gh aw compile .github/workflows/docs-worker.md --strict --approve --logical-repo trvny/trvny --schedule-seed trvny/trvny
      - name: Compile orchestrator second
        run: |
          set -euo pipefail
          gh aw compile .github/workflows/docs-orchestrator.md --strict --approve --logical-repo trvny/trvny --schedule-seed trvny/trvny
      - uses: actions/upload-artifact@v4
        with:
          name: docs-expansion-locks
          path: |
            .github/workflows/docs-worker.lock.yml
            .github/workflows/docs-orchestrator.lock.yml
      - name: Publish locks to control-plane branch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          publish() {
            path="$1"
            file="$2"
            sha="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/trvny/trvny/contents/${path}?ref=ci%2Fexpand-docs-control" | jq -r .sha)"
            python3 - "$file" "$sha" > payload.json <<'PY'
          import base64, json, pathlib, sys
          file_path = pathlib.Path(sys.argv[1])
          sha = sys.argv[2]
          json.dump({
              "message": "ci: refresh expanded docs locks",
              "content": base64.b64encode(file_path.read_bytes()).decode(),
              "sha": sha,
              "branch": "ci/expand-docs-control",
          }, sys.stdout)
          PY
            curl -fsSL -X PUT \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              --data-binary @payload.json \
              "https://api.github.com/repos/trvny/trvny/contents/${path}" >/dev/null
          }
          publish ".github/workflows/docs-worker.lock.yml" ".github/workflows/docs-worker.lock.yml"
          publish ".github/workflows/docs-orchestrator.lock.yml" ".github/workflows/docs-orchestrator.lock.yml"
