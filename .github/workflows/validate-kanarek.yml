---
name: Validate Kanarek

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - "kanarek/**"
      - ".github/workflows/kanarek-companion.yml"
      - ".github/workflows/validate-kanarek.yml"
  push:
    branches:
      - main
    paths:
      - "kanarek/**"
      - ".github/workflows/kanarek-companion.yml"
      - ".github/workflows/validate-kanarek.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: |
          node --check kanarek/kanarek-companion.cjs
          node --check kanarek/kanarek-companion-bank.cjs
          node --check kanarek/kanarek-companion-quip.cjs
          node --check kanarek/kanarek-companion-view.cjs

      - name: Check portable areas, optional CI and phrase bank
        run: |
          node <<'NODE'
          const view = require('./kanarek/kanarek-companion-view.cjs');
          const bank = require('./kanarek/kanarek-companion-bank.cjs');

          const areas = view.areas([
            '.github/workflows/ci.yml',
            'src/index.ts',
            'docs/setup.md',
          ]);
          if (areas.join('|') !== 'Automatyka GitHub|Kod źródłowy|Dokumentacja') {
            throw new Error(`unexpected areas: ${areas.join('|')}`);
          }

          process.env.KANAREK_REQUIRE_CI = 'false';
          const state = view.status(
            {
              merged: false,
              state: 'open',
              draft: false,
              mergeable: true,
              mergeable_state: 'clean',
              base: { ref: 'main' },
            },
            { behind: 0 },
            { total: 0, pending: [], failed: [], passed: [] },
            { changes: 0, approvals: 0 },
          );
          if (state.key !== 'ready') {
            throw new Error(`CI-less repository stayed ${state.key}`);
          }

          const merged = bank.mergeEntries(
            [{ k: '0123456789abcdef', q: 'Pierwszy zapisany tekst Kanarka.' }],
            [{ k: '0123456789abcdef', q: 'Pierwszy zapisany tekst Kanarka.' }],
          );
          if (merged.length !== 1) throw new Error('phrase bank did not deduplicate');
          NODE
