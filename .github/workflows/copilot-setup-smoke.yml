name: Copilot setup smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "copilot-setup/**"
      - ".github/workflows/copilot-setup-smoke.yml"
  push:
    branches: [main]
    paths:
      - "copilot-setup/**"
      - ".github/workflows/copilot-setup-smoke.yml"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # trvny/trvny is private; its own wrapper PR exercises that profile.
        repository:
          - trvny/feedseek
          - trvny/kanarek
          - trvny/Autka
          - trvny/tvpi
          - trvny/WiFi-Automatic
    steps:
      - name: Checkout shared setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _shared
          persist-credentials: false

      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          path: target
          persist-credentials: false

      - name: Run shared Copilot setup
        uses: ./_shared/copilot-setup
        with:
          repository: ${{ matrix.repository }}
          root: target
