name: Copilot setup smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/copilot-setup/**"
      - ".github/workflows/copilot-setup-smoke.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/copilot-setup/**"
      - ".github/workflows/copilot-setup-smoke.yml"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        repository:
          - trvny/feedseek
          - trvny/kanarek
          - trvny/Autka
          - trvny/tvpi
          - trvny/trvny
          - trvny/WiFi-Automatic
    steps:
      - name: Checkout shared setup
        uses: actions/checkout@v7
        with:
          path: _shared
          persist-credentials: false

      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          path: target
          persist-credentials: false

      - name: Prepare target workspace
        shell: bash
        run: |
          shopt -s dotglob nullglob
          mv target/* .
          rmdir target

      - name: Run shared Copilot setup
        uses: ./_shared/.github/actions/copilot-setup
        with:
          repository: ${{ matrix.repository }}
