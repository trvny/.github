name: Pre-commit

on: # yamllint disable-line rule:truthy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Pre-commit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Go for Gitleaks
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.3.0

      - name: Run configured hooks
        run: pre-commit run --all-files --show-diff-on-failure

      # The Gitleaks pre-commit hook checks staged changes; CI has none staged.
      - name: Scan current repository for secrets
        shell: bash
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          "$HOME/go/bin/gitleaks" dir --redact --no-banner .
