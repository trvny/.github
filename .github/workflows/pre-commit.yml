name: Pre-commit

on: # yamllint disable-line rule:truthy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Pre-commit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Go for Gitleaks
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.3.0

      - name: Check changed files on PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pre-commit run --from-ref "$BASE_SHA" --to-ref HEAD --show-diff-on-failure

      - name: Check all files on manual audit
        if: github.event_name == 'workflow_dispatch'
        run: pre-commit run --all-files --show-diff-on-failure

      # The local hook checks staged files, but CI has nothing staged.
      - name: Scan current repository for secrets
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$HOME/go/bin/gitleaks" dir --redact --no-banner .

      - name: Scan pull request commit history for secrets
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          "$HOME/go/bin/gitleaks" git --redact --no-banner --log-opts="$BASE_SHA..HEAD" .
