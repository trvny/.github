name: stats

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate-contributors.cjs"
      - ".github/workflows/stats.yml"
  schedule:
    - cron: "17 4 1 */3 *"
  workflow_dispatch:
    inputs:
      force_contributors:
        description: Regenerate the contributor card even when membership is unchanged
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_contributors:
        required: false
        type: boolean
        default: false

concurrency:
  group: stats-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

env:
  OWNERS: |
    trvny
    travnie

jobs:
  stats:
    name: Refresh profile assets
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: contributors card
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORCE_CONTRIBUTORS: ${{ inputs.force_contributors }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const run = require("./.github/scripts/generate-contributors.cjs");
            await run({ github, core });

      - name: top languages card
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=13&hide_title=true&theme=ambient_gradient&show_icons=true&locale=pl
          path: assets/profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: feedseek card
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=trvny%2Ffeedseek&theme=great-gatsby&description_lines_count=1
          path: assets/profile/pin-feeds.svg
          token: ${{ github.token }}

      - name: kanarek card
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=travnie%2Fkanarek&theme=shades-of-purple&description_lines_count=1
          path: assets/profile/pin-kanarek.svg
          token: ${{ github.token }}

      - name: tvpi card
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=trvny%2Ftvpi&theme=yeblu&description_lines_count=1
          path: assets/profile/pin-tvpi.svg
          token: ${{ github.token }}

      - name: wambridge card
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=travnie%2Fwambridge&theme=blue_navy&description_lines_count=1
          path: assets/profile/pin-wambridge.svg
          token: ${{ github.token }}

      - name: autka card
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=travnie%2Fautka&theme=synthwave&description_lines_count=1
          path: assets/profile/pin-autka.svg
          token: ${{ github.token }}

      - name: gist card
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: gist
          options: id=167d2271e3cf7d21e118aa7d906a7d2c&theme=aura
          token: ${{ secrets.GH_PAT }}
          path: assets/profile/gist.svg

      - name: Commit profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/*.svg assets/profile/contributors.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(readme): refresh profile assets [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
