name: stats
on: 
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: stats-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  stats:
    name: Refresh cards
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Keep workflow alive
        # Scheduled workflows are auto-disabled after 60 days of repo
        # inactivity; re-enabling on every run prevents that.
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stats.yml/enable"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_title=true&include_all_commits=true&prs_merged,prs_merged_percentage,prs_authored,prs_commented&theme=neon)
          path: assets/profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&show_icons=true&layout=donut&hide_title=true&langs_count=15&&size_weight=0.5&count_weight=0.5&theme=ambient_gradient
          path: assets/profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}
 
      - name: Feeds card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=trvny%2Ffeeds&theme=great-gatsby
          path: assets/profile/pin_feeds.svg
          token: ${{ secrets.GH_PAT }}

      - name: TVPI card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=trvny%2Ftvpi&theme=yeblu
          path: assets/profile/pin_tvpi.svg
          token: ${{ secrets.GH_PAT }}

      - name: WamBridge card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=trvny%2Fwambridge&theme=blue_navy
          path: assets/profile/pin_wambridge.svg
          token: ${{ secrets.GH_PAT }}

      - name: Gist card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: gist
          options: id=167d2271e3cf7d21e118aa7d906a7d2c&&theme=chartreuse-dark&browser_rendering=true
          path: assets/profile/gist.svg
          token: ${{ secrets.GH_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/*.svg
          git commit -m "chore(readme): refresh cards [skip ci]" || exit 0
          git push
