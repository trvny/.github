name: stats

on:
#  schedule:
#    - cron: "37 21 * */6 *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: stats-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  stats:
    name: Refresh pins
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=12&hide_title=true&theme=ambient_gradient
          path: assets/profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: feeds card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=trvny%2Ffeeds&theme=great-gatsby&description_lines_count=1
          path: assets/profile/pin-feeds.svg
          token: ${{ github.token }}

      - name: tvpi card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=trvny%2Ftvpi&theme=yeblu
          path: assets/profile/pin-tvpi.svg
          token: ${{ github.token }}

      - name: wambridge card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=trvny%2Fwambridge&theme=blue_navy
          path: assets/profile/pin-wambridge.svg
          token: ${{ github.token }}

      - name: autka card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=trvny%2Fautka&theme=synthwave
          path: assets/profile/pin-autka.svg
          token: ${{ github.token }}

      - name: Commit pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(readme): refresh pins [skip ci]"
          git pull --rebase origin main
          git push
