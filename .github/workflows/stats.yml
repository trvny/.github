name: stats

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: stats-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  stats:
    name: Refresh pins
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: feeds card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=trvny%2Ffeeds&theme=great-gatsby
          path: assets/profile/pin_feeds.svg
          token: ${{ github.token }}

      - name: tvpi card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=trvny%2Ftvpi&theme=yeblu
          path: assets/profile/pin_tvpi.svg
          token: ${{ github.token }}

      - name: wambridge card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pl&repo=trvny%2Fwambridge&theme=blue_navy
          path: assets/profile/pin_wambridge.svg
          token: ${{ github.token }}

      - name: Commit pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/pin_*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(readme): refresh pins [skip ci]"
          git pull --rebase origin main
          git push
