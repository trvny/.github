name: stats

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate-contributors.cjs"
      - ".github/workflows/stats.yml"
  schedule:
    - cron: "17 4 1 */3 *"
  workflow_dispatch:
    inputs:
      force_contributors:
        description: Regenerate the contributor card even when membership is unchanged
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_contributors:
        required: false
        type: boolean
        default: false

concurrency:
  group: stats-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

env:
  OWNERS: |
    trvny
    travnie

jobs:
  stats:
    name: Refresh profile assets
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: write
      discussions: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: contributors card
        if: github.repository == 'trvny/.github' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORCE_CONTRIBUTORS: ${{ inputs.force_contributors }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const run = require("./.github/scripts/generate-contributors.cjs");
            await run({ github, core });

      # Cards run only on manual/reusable invocations. The upstream composite
      # action bootstraps pnpm, Node, and npm core on *every* use. Prepare once.
      - name: Checkout stats card renderer
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: actions/checkout@v7
        with:
          repository: stats-organization/github-readme-stats-action
          ref: 2c498845f71017821efaad14293ebc736156ef21 # v2.1.0 (v2 tag)
          path: .github-stats-action
          persist-credentials: false

      - name: Set up pnpm once
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .github-stats-action/package.json

      - name: Set up Node and pnpm cache
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .github-stats-action/package.json
          cache: pnpm
          cache-dependency-path: .github-stats-action/pnpm-lock.yaml

      - name: Install stats renderer dependencies once
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        working-directory: .github-stats-action
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Generate seven profile cards
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        shell: bash
        env:
          CARD_OWNER: ${{ github.repository_owner }}
          CARD_TOKEN: ${{ github.token }}
          GIST_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Reuse the upstream action's bundled core; no seven repeated npm
          # installs of core@v2. The action's pinned lockfile supplies core 2.2.0.
          render() {
            local card="$1" output="$2" options="$3" token="${4:-$CARD_TOKEN}"
            INPUT_CARD="$card" INPUT_PATH="$output" INPUT_OPTIONS="$options" \
              INPUT_CORE_VERSION="" INPUT_FAIL_ON_ERROR="true" PAT_1="$token" \
              node .github-stats-action/index.js
          }
          render top-langs assets/profile/top-langs.svg "username=${CARD_OWNER}&layout=donut&langs_count=13&hide_title=true&theme=ambient_gradient&show_icons=true&locale=pl"
          render pin assets/profile/pin-feeds.svg "username=${CARD_OWNER}&show_icons=true&locale=pl&repo=trvny%2Ffeedseek&theme=great-gatsby&description_lines_count=1"
          render pin assets/profile/pin-kanarek.svg "username=${CARD_OWNER}&show_icons=true&locale=pl&repo=travnie%2Fkanarek&theme=shades-of-purple&description_lines_count=1"
          render pin assets/profile/pin-tvpi.svg "username=${CARD_OWNER}&show_icons=true&locale=pl&repo=trvny%2Ftvpi&theme=yeblu&description_lines_count=1"
          render pin assets/profile/pin-wambridge.svg "username=${CARD_OWNER}&show_icons=true&locale=pl&repo=travnie%2Fwambridge&theme=blue_navy&description_lines_count=1"
          render pin assets/profile/pin-autka.svg "username=${CARD_OWNER}&show_icons=true&locale=pl&repo=travnie%2Fautka&theme=synthwave&description_lines_count=1"
          render gist assets/profile/gist.svg "id=167d2271e3cf7d21e118aa7d906a7d2c&theme=aura" "$GIST_TOKEN"


      - name: Commit profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/*.svg assets/profile/contributors.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(readme): refresh profile assets [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
